name: Check benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_v0.py'
      - run: python -m unittest discover -s experiments/gpu_calibration -p 'test_*.py'
      - run: python -m unittest discover -s experiments/full_cohort -p 'test_*.py'
      - run: python dashboard.py
      - run: git diff --exit-code -- docs/index.html docs/leaderboard.html docs/run.html
